version: "3.9"

services:
  redis:
    image: redis:7
    container_name: notify-project
    ports:
      - "6380:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - REDIS_URI=redis://redis:6379
    depends_on:
      - redis
    ports:
      - "5000:5000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      - REDIS_URI=redis://redis:6379
    depends_on:
      - redis
    deploy:
      replicas: 2
